# docker-compose.yml    # postgres(pgvector), api, worker, web, langfuse (optional)
# Dev PC memory constraint: Docker memory capped at 3 GB total (8 GB RAM machine, mock profile).
# Memory budget allocation: postgres 1024M + api 1024M + worker 512M + web 512M = 3072M (3.0 GB).

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: cka-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-knowledge_assistant}
      POSTGRES_USER: ${POSTGRES_USER:-cka_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          memory: 1024M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cka_admin} -d ${POSTGRES_DB:-knowledge_assistant}"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cka-api
    command: uv run uvicorn app.api.app:create_app --factory --host 0.0.0.0 --port 8000 --reload
    environment:
      APP_PROFILE: ${APP_PROFILE:-mock}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-cka_admin}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-knowledge_assistant}
      LOCAL_STORAGE_PATH: ${LOCAL_STORAGE_PATH:-/var/lib/cka/storage}
      SESSION_UPLOAD_RETENTION_HOURS: "${SESSION_UPLOAD_RETENTION_HOURS:-24}"
      LANGSMITH_TRACING: "false"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 1024M

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cka-worker
    command: uv run procrastinate --app=app.worker.app worker
    environment:
      APP_PROFILE: ${APP_PROFILE:-mock}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-cka_admin}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-knowledge_assistant}
      LOCAL_STORAGE_PATH: ${LOCAL_STORAGE_PATH:-/var/lib/cka/storage}
      SESSION_UPLOAD_RETENTION_HOURS: "${SESSION_UPLOAD_RETENTION_HOURS:-24}"
      LANGSMITH_TRACING: "false"
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: cka-web
    command: npm run dev
    ports:
      - "3000:3000"
    environment:
      API_ORIGIN: ${API_ORIGIN:-http://api:8000}
      NEXT_PUBLIC_API_URL: http://api:8000
    deploy:
      resources:
        limits:
          memory: 512M

  # Optional local visual tracing container (synthetic data only):
  # langfuse:
  #   image: langfuse/langfuse:2
  #   container_name: cka-langfuse
  #   ports:
  #     - "3001:3000"

volumes:
  postgres_data:
