# See https://pre-commit.com for more information
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-added-large-files
        args: ['--maxkb=1000']
      - id: detect-private-key
      - id: mixed-line-ending
        args: ['--fix=lf']

  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        exclude: (?x)^(backend/uv\.lock)$

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.9
    hooks:
      - id: ruff
        args: [--fix, --config=backend/pyproject.toml]
        files: ^backend/
      - id: ruff-format
        args: [--config=backend/pyproject.toml]
        files: ^backend/

  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: uv --directory backend run python -m mypy app tests
        language: system
        pass_filenames: false
        always_run: true
      - id: boundary-invariants
        name: boundary-invariants
        # Pure (no-database) invariant checks only. Database-backed invariant tests such as
        # tests/invariants/test_adversarial_cross_tenant_isolation.py run in the normal pytest
        # step after roles are bootstrapped and migrations applied.
        entry: >-
          uv --directory backend run python -m pytest
          tests/invariants/test_architecture_boundaries.py
          tests/invariants/test_migration_invariants.py
          tests/invariants/test_phi_session_isolation.py
        language: system
        pass_filenames: false
        always_run: true
