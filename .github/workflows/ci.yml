name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Lint and Test
    runs-on: ubuntu-24.04

    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: knowledge_assistant
          POSTGRES_USER: cka_admin
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      # Non-production throwaway test configuration for CI only
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_DB: knowledge_assistant
      POSTGRES_USER: cka_admin
      DB_APP_USER: app_user
      DB_RETRIEVER_USER: retriever_user
      LANGSMITH_TRACING: "false"
      AUTH_HMAC_KEY: ci_auth_hmac_key_throwaway
      COOKIE_SECURE: "false"
      APP_PROFILE: mock
      HF_HUB_OFFLINE: "1"
      SESSION_UPLOAD_RETENTION_HOURS: "24"
      LOCAL_STORAGE_PATH: /tmp/cka-storage

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.22"
          enable-cache: true
          cache-dependency-glob: "backend/uv.lock"

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Configure throwaway CI credentials
        run: |
          val="ci_test"
          for prefix in POSTGRES DB_APP DB_RETRIEVER; do
            echo "${prefix}_PASSWORD=$val" >> "$GITHUB_ENV"
          done

      - name: Install dependencies
        run: uv --directory backend sync --frozen

      - name: Run pre-commit checks
        run: uv --directory backend run pre-commit run --all-files

      - name: Bootstrap database roles
        run: uv --directory backend run python scripts/bootstrap_db_roles.py

      - name: Run database migrations
        run: uv --directory backend run alembic upgrade head

      - name: Prepare local storage folder
        run: mkdir -p /tmp/cka-storage

      - name: Run test suite (no real models in CI)
        run: uv --directory backend run pytest -m "not models"
