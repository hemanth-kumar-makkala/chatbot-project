[project]
name = "backend"
version = "0.1.0"
description = "Client Knowledge Assistant Backend Service"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.10.0,<3.0.0",
    "sqlalchemy[asyncio]>=2.0.36,<3.0.0",
    "alembic>=1.14.0,<2.0.0",
    "psycopg[binary]>=3.2.3,<4.0.0",
    "langgraph>=1.2.12,<2.0.0",
    "langgraph-checkpoint-postgres>=3.1.2,<4.0.0",
    "fastapi>=0.142.2,<1.0.0",
    "uvicorn[standard]>=0.54.0,<1.0.0",
    "argon2-cffi>=25.1.0,<26.0.0",
]

[dependency-groups]
dev = [
    "ruff>=0.7.0,<1.0.0",
    "mypy>=1.13.0,<2.0.0",
    "pytest>=8.3.0,<9.0.0",
    "pre-commit>=4.0.0,<5.0.0",
    "detect-secrets>=1.5.0,<2.0.0",
    "pytest-asyncio>=0.24.0,<1.0.0",
    "langgraph-cli[inmem]>=0.4.32,<1.0.0",
    "httpx>=0.28.1,<1.0.0",
]


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]


[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "ARG", # flake8-unused-arguments
    "SIM", # flake8-simplify
]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true

# Strict type enforcement on core engine and interfaces
[[tool.mypy.overrides]]
module = ["app.core.*", "app.ports.*"]
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-ra -q"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.pyrefly.errors]
bad-specialization = false
