[project]
name = "backend"
version = "0.1.0"
description = "Client Knowledge Assistant Backend Service"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.10.0,<3.0.0",
    "sqlalchemy[asyncio]>=2.0.36,<3.0.0",
    "alembic>=1.14.0,<2.0.0",
    "psycopg[binary]>=3.2.3,<4.0.0",
    "langgraph>=1.2.12,<2.0.0",
    "langgraph-checkpoint-postgres>=3.1.2,<4.0.0",
    "fastapi>=0.142.2,<1.0.0",
    "uvicorn[standard]>=0.54.0,<1.0.0",
    "argon2-cffi>=25.1.0,<26.0.0",
    "pypdfium2==5.14.0",
    "pillow==12.3.0",
    "openpyxl==3.1.5",
    "defusedxml==0.7.1",
    "procrastinate==3.10.0",
    "httpx==0.28.1",
    "pyyaml==6.0.3",
]

[dependency-groups]
dev = [
    "ruff>=0.7.0,<1.0.0",
    "mypy>=1.13.0,<2.0.0",
    "pytest>=8.3.0,<9.0.0",
    "pre-commit>=4.0.0,<5.0.0",
    "detect-secrets>=1.5.0,<2.0.0",
    "pytest-asyncio>=0.24.0,<1.0.0",
    "langgraph-cli[inmem]>=0.4.32,<1.0.0",
    "httpx>=0.28.1,<1.0.0",
    "pypdf==6.19.0",
    "types-openpyxl==3.1.5.20260827",
    "types-defusedxml==0.7.0.20260504",
    "types-pyyaml==6.0.12.20260906",
]
parsing = [
    "docling[easyocr]==2.135.0",
    "torch==2.14.1",
    "torchvision==0.29.1",
]
retrieval = [
    "sentence-transformers==6.1.0",
]


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]


[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "ARG", # flake8-unused-arguments
    "SIM", # flake8-simplify
]
ignore = []

[tool.ruff.lint.per-file-ignores]
"app/api/app.py" = ["E402"]
"studio/entry.py" = ["E402"]
"backend/app/api/app.py" = ["E402"]
"backend/studio/entry.py" = ["E402"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
exclude = ["tests/debug_q1\\.py"]

# Strict type enforcement on core engine and interfaces
[[tool.mypy.overrides]]
module = ["app.core.*", "app.ports.*"]
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = [
    "docling.datamodel.accelerator_options",
    "docling.datamodel.base_models",
    "docling.datamodel.pipeline_options",
    "docling.document_converter",
    "easyocr",
    "sentence_transformers",
    "sentence_transformers.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-ra -q -m \"not models and not slow\""
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "models: tests requiring real ML model weights (run on desktop-gpu only)",
    "slow: slow execution benchmarks (skipped by default, run on demand)",
]

[[tool.uv.index]]
name = "pytorch-cuda"
# CUDA 12.6 wheels; torch 2.14.1 and torchvision 0.29.1 confirmed for win_amd64 cp312
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cuda", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchvision = [
    { index = "pytorch-cuda", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[tool.pyrefly.errors]
bad-specialization = false
