          extract: 4096
          judge: 1024
        notes: "Compact CPU judge/text model from office-cpu profile."

  gemini:
    display_name: "Google Gemini (AI Studio)"
    transport: openai_compatible
    coming_later: false
    structured_output_mode: json_schema
    reasoning_off_params:
      reasoning_effort: "none"
    required_env:
      - GEMINI_API_KEY
      - GEMINI_BASE_URL
    runtime_settings:
      timeout_seconds: 60.0
      max_retries: 3
      max_total_wait_seconds: 20.0
      requests_per_minute: 10
      max_image_dimension: 1536
    notes: "OpenAI-compatible Google AI Studio endpoint (synthetic test data only; no BAA)."
    models:
      - provider: gemini
        model: "gemini-3.5-flash"
        display_name: "Gemini 3.5 Flash"
        supports_vision: true
        remote: true
        baa_covered: false
        allowed_roles: ["answer"]
        temperature: 0.0
        reasoning: false
        generation_limits:
          router: 1024
          answer: 4096
          vision: 4096
          extract: 4096
          judge: 1024
        notes: "Fast multimodal answer model via AI Studio (synthetic test data only)."
      - provider: gemini
        model: "gemini-3.5-flash-lite"
        display_name: "Gemini 3.5 Flash Lite"
        supports_vision: false
        remote: true
        baa_covered: false
        allowed_roles: ["judge"]
        temperature: 0.0
        reasoning: false
        # Google AI Studio rejects reasoning_effort="none" on gemini-3.5-flash-lite (400 INVALID_ARGUMENT).
        reasoning_off_params: {}
        generation_limits:
          router: 1024
          answer: 4096
          vision: 4096
          extract: 4096
          judge: 1024
        notes: "Lightweight text-only judge model via AI Studio (synthetic test data only)."
