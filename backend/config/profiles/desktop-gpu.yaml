# Runtime Profile: desktop-gpu (Default profile for real-model work)
# Hardware: Intel Core i7-12700F, 32 GB RAM, NVIDIA RTX 3050 6 GB
# Model setup: qwen3:8b for router/answer and qwen3-vl:4b-instruct for vision/extract/judge to fit 6 GB VRAM;
# embeddings and reranker offloaded to CPU.
profile: desktop-gpu
catalog_providers:
  - ollama
models:
  router:  { provider: ollama, model: "qwen3:8b", supports_vision: false, remote: false, baa_covered: false, temperature: 0.0, reasoning: false }
  answer:  { provider: ollama, model: "qwen3:8b", supports_vision: false, remote: false, baa_covered: false, temperature: 0.0, reasoning: false }
  vision:  { provider: ollama, model: "qwen3-vl:4b-instruct", supports_vision: true, remote: false, baa_covered: false, temperature: 0.0, reasoning: false }
  extract: { provider: ollama, model: "qwen3-vl:4b-instruct", supports_vision: true, remote: false, baa_covered: false, temperature: 0.0, reasoning: false }
  judge:   { provider: ollama, model: "qwen3-vl:4b-instruct", supports_vision: true, remote: false, baa_covered: false, temperature: 0.0, reasoning: false }
generation_limits:
  "beam:cloud":
    router: 1024
    answer: 2048
    extract: 2048
    judge: 1024
  "qwen3:8b":
    router: 1024
    answer: 4096
    vision: 4096
    extract: 4096
    judge: 1024
  "qwen3-vl:4b-instruct":
    router: 1024
    answer: 4096
    vision: 4096
    extract: 4096
    judge: 1024
embeddings:
  provider: local
  model: "BAAI/bge-m3"
  revision: "5617a9f61b028005a4858fdac845db406aefb181"  # pragma: allowlist secret
  device: cpu
  max_seq_length: 8192
reranker:
  provider: local
  model: "BAAI/bge-reranker-v2-m3"
  revision: "953dc6f6f85a1b2dbfca4c34a2796e7dde08d41e"  # pragma: allowlist secret
  device: cpu
storage:    { backend: local, path: ./data/files }
queue:      { backend: procrastinate }
