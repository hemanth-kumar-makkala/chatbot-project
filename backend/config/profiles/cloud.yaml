# Runtime Profile: cloud (GCP Production/Staging under BAA)
# Target: Cloud Run, Vertex AI (BAA covered), Cloud SQL pgvector, Cloud Storage
profile: cloud
models:
  router:  { provider: vertex, model: "gemini-1.5-flash-002", supports_vision: true, remote: true, baa_covered: true, temperature: 0.0, reasoning: false }
  answer:  { provider: vertex, model: "gemini-1.5-pro-002", supports_vision: true, remote: true, baa_covered: true, temperature: 0.0, reasoning: false }
  vision:  { provider: vertex, model: "gemini-1.5-pro-002", supports_vision: true, remote: true, baa_covered: true, temperature: 0.0, reasoning: false }
  extract: { provider: vertex, model: "gemini-1.5-pro-002", supports_vision: true, remote: true, baa_covered: true, temperature: 0.0, reasoning: false }
  judge:   { provider: vertex, model: "gemini-1.5-flash-002", supports_vision: true, remote: true, baa_covered: true, temperature: 0.0, reasoning: false }
generation_limits:
  "vertex:*": {router: 1024, answer: 4096, vision: 4096, extract: 4096, judge: 1024}
embeddings: { provider: vertex, model: "text-embedding-004", dimension: 768 }
reranker:   { provider: local, model: "BAAI/bge-reranker-v2-m3", device: cpu }
storage:    { backend: gcs, bucket: "${GCS_STORAGE_BUCKET}" }
queue:      { backend: procrastinate }
